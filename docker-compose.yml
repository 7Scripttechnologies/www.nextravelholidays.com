services:
  mysql:
    image: mysql:8.4
    container_name: nextravel-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: nextravel
      MYSQL_DATABASE: nextravel
      MYSQL_USER: nextravel
      MYSQL_PASSWORD: nextravel
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - nextravel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unextravel", "-pnextravel"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nextravel_mysql_data:
